[project]
name = "campuslens-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1", "pypdf>=5,<7", "openai>=1.80,<3", "google-genai>=1,<2", "truststore>=0.10,<1", "python-dotenv>=1,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ocr = ["pypdfium2>=4.30,<6", "Pillow>=11,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
